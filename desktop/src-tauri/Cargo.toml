[package]
name = "plaudr"
version = "0.1.0"
description = "Ende-zu-Ende-verschlüsselte Sprachkonferenz für kleine Runden"
authors = []
license = "AGPL-3.0-only"
repository = "https://github.com/coreequip/plaudr"
edition = "2021"

[lib]
# Eigener Name, damit sich Bibliothek und Binary unter Windows nicht ins Gehege kommen.
name = "plaudr_lib"
# Nur rlib für main.rs; staticlib und cdylib aus der Vorlage braucht Tauri nur für iOS und Android.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-process = "=2.4.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
# Für die Plugin-Konfiguration aus tauri.conf.json, die generate_context! einbettet.
serde_json = "=1.0.154"

# Einzelinstanz gibt es nur auf dem Desktop; mit deep-link reicht eine zweite Instanz ihren Link weiter.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }

[profile.release]
# Auf Größe optimiert, siehe docs/spike-desktop.md.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

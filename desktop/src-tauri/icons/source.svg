<!-- Vorlage für die App-Icons: Mikrofon-Symbol des Mocks, weiß auf grünem Quadrat.
     Neu erzeugen (aus desktop/):
       rsvg-convert -w 1024 -h 1024 src-tauri/icons/source.svg -o /tmp/plaudr-1024.png
       npx tauri icon /tmp/plaudr-1024.png -o src-tauri/icons
     Danach nur die in tauri.conf.json eingetragenen Dateien behalten. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#0f5c1a"/>
  <g transform="translate(176 190) scale(28)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="12" rx="3"/>
    <path d="M5 10a7 7 0 0 0 14 0"/>
    <path d="M12 17v4"/>
  </g>
</svg>

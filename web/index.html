<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plaudr</title>
  </head>
  <body>
    <main>
      <h1>plaudr</h1>

      <section id="start" hidden>
        <p>Sprachraum für kleine Runden. Wer den Link hat, ist dabei.</p>
        <button id="create" class="primary">Neuen Raum erstellen</button>
      </section>

      <section id="lobby" hidden>
        <label for="name">Dein Name</label>
        <input id="name" maxlength="40" autocomplete="nickname" required />
        <div id="backup" class="card" hidden>
          <p>Sichere deinen Schlüssel. Mit der Sicherungsdatei nimmst du deine Identität in die App oder einen anderen Browser mit.</p>
          <label for="backup-pw">Passwort für die Sicherung</label>
          <input id="backup-pw" type="password" autocomplete="new-password" />
          <label for="backup-pw2">Passwort wiederholen</label>
          <input id="backup-pw2" type="password" autocomplete="new-password" />
          <button id="backup-save">Sicherung herunterladen</button>
          <details id="restore">
            <summary>Schon eine Sicherung? Hier laden</summary>
            <input id="restore-file" type="file" accept=".plaudr-key,application/json" aria-label="Sicherungsdatei" />
            <label for="restore-pw">Passwort der Sicherung</label>
            <input id="restore-pw" type="password" autocomplete="current-password" />
            <button id="restore-load">Sicherung laden</button>
          </details>
          <p id="backup-error" class="warn" hidden></p>
        </div>
        <button id="join" class="primary" disabled>Beitreten</button>
        <button id="backup-again" class="link" hidden>Schlüssel sichern oder Sicherung laden</button>
        <p id="lobby-notice" class="warn" hidden></p>
      </section>

      <section id="call" hidden>
        <div class="row">
          <input id="link" readonly aria-label="Einladungslink" />
          <button id="copy">Link kopieren</button>
        </div>
        <p id="notice" hidden></p>
        <button id="unmute-audio" class="primary" hidden>Ton aktivieren</button>
        <ul id="peers"></ul>
        <p id="alone">Noch niemand da. Schick den Link herum.</p>
        <div class="row">
          <button id="mute">Stumm</button>
          <button id="leave">Verlassen</button>
        </div>
        <div id="audio" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
